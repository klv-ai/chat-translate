[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chat-translate"
version = "0.1.0"
description = "Provider-agnostic chat translation SDK (DeepL / local GGUF via llama.cpp): masking, per-room fan-out + cache, source resolution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "chat-translate" }]
keywords = ["translation", "chat", "deepl", "llama.cpp", "gguf", "language-detection"]
dependencies = [
  "eld>=1.0.4",     # pure-Python ELD language detector (ISO 639-1), only depends on `regex`
  "regex>=2024.0.0", # masking needs \p{Extended_Pictographic} etc., which stdlib `re` lacks
  "httpx>=0.27.0",  # DeepL provider HTTP client
]

[project.optional-dependencies]
# Heavy native build; the calling app usually supplies a llama_cpp.Llama instance,
# which can be injected. Install this extra only to let the SDK build one itself.
local = ["llama-cpp-python>=0.3.0"]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chat_translate"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["eld.*", "llama_cpp.*", "regex.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
